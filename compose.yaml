services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: neurosync_migrator
      POSTGRES_DB: neurosync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private local database password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurosync_migrator -d neurosync"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
